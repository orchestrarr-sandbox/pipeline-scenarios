name: p5-deploy
on:
  push:
    paths: ["p5-deploy/**", ".github/workflows/p5-deploy.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deploy (start the new version)
        run: |
          python p5-deploy/server.py &
          echo $! > server.pid
          sleep 2
      - name: Smoke test
        run: |
          curl --fail --silent --show-error http://localhost:8080/health
