name: p4-matrix
on:
  push:
    paths: ["p4-matrix/**", ".github/workflows/p4-matrix.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node p4-matrix/test.js
