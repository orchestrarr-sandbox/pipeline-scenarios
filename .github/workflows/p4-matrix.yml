name: p4-matrix
on:
  push:
    paths: ["p4-matrix/**", ".github/workflows/p4-matrix.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python p4-matrix/test.py
