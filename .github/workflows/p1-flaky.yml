name: p1-flaky
on:
  push:
    paths: ["p1-flaky/**", ".github/workflows/p1-flaky.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python p1-flaky/test.py
