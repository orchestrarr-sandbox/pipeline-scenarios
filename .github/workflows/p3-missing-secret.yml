name: p3-missing-secret
on:
  push:
    paths: [".github/workflows/p3-missing-secret.yml"]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        run: |
          test -n "$REGISTRY_TOKEN" || { echo "REGISTRY_TOKEN is not set"; exit 1; }
          echo "publishing"
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
